name: Daily Wedding Data Scrape

on:
  schedule:
    - cron: '23 19 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8
        with:
          enable-cache: true

      - name: Install dependencies
        run: make sync

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Create .env file
        run: |
          cat > .env << EOF
          BRIDELY_BASE_URL=${{ secrets.BRIDELY_BASE_URL }}
          BRIDELY_APP_ID=${{ secrets.BRIDELY_APP_ID }}
          BRIDELY_VENUES_DATASOURCE_ID=${{ secrets.BRIDELY_VENUES_DATASOURCE_ID }}
          BRIDELY_VENUES_ENDPOINT_ID=${{ secrets.BRIDELY_VENUES_ENDPOINT_ID }}
          BRIDELY_ALL_VENDORS_ENDPOINT=${{ secrets.BRIDELY_ALL_VENDORS_ENDPOINT }}
          BRIDELY_MAKEUP_ARTISTS_ENDPOINT=${{ secrets.BRIDELY_MAKEUP_ARTISTS_ENDPOINT }}
          BRIDELY_VIDEOGRAPHERS_ENDPOINT=${{ secrets.BRIDELY_VIDEOGRAPHERS_ENDPOINT }}
          BRIDELY_EMCEES_ENDPOINT=${{ secrets.BRIDELY_EMCEES_ENDPOINT }}
          BRIDELY_WEDDING_PLANNERS_ENDPOINT=${{ secrets.BRIDELY_WEDDING_PLANNERS_ENDPOINT }}
          BRIDELY_JUSTICES_ENDPOINT=${{ secrets.BRIDELY_JUSTICES_ENDPOINT }}
          BRIDELY_PHOTOBOOTHS_ENDPOINT=${{ secrets.BRIDELY_PHOTOBOOTHS_ENDPOINT }}
          BRIDELY_LIVE_MUSIC_ENDPOINT=${{ secrets.BRIDELY_LIVE_MUSIC_ENDPOINT }}
          BRIDELY_WEDDING_CARS_ENDPOINT=${{ secrets.BRIDELY_WEDDING_CARS_ENDPOINT }}
          BRIDELY_WEDDING_FAVOURS_ENDPOINT=${{ secrets.BRIDELY_WEDDING_FAVOURS_ENDPOINT }}
          BRIDELY_ENGAGEMENT_RINGS_ENDPOINT=${{ secrets.BRIDELY_ENGAGEMENT_RINGS_ENDPOINT }}
          EOF

      - name: Run TWN scraper
        id: twn
        run: uv run python -m src.twn.main
        timeout-minutes: 15
        continue-on-error: true

      - name: Run BlissfulBrides scraper
        id: bb
        run: uv run python -m src.bb.main
        timeout-minutes: 15
        continue-on-error: true

      - name: Run Bridely venues scraper
        id: bly-venues
        run: uv run python -m src.bly.main
        timeout-minutes: 15
        continue-on-error: true

      - name: Run Bridely vendors scraper
        id: bly-vendors
        run: uv run python -m src.bly.vendors
        timeout-minutes: 15
        continue-on-error: true

      - name: Run Wedded.sg venues scraper
        id: wd-venues
        run: uv run python -m src.wd.main
        timeout-minutes: 15
        continue-on-error: true

      - name: Run Wedded.sg photographers scraper
        id: wd-photographers
        run: uv run python -m src.wd.photographers
        timeout-minutes: 15
        continue-on-error: true

      - name: Run SingaporeBrides scraper
        id: sb
        run: uv run python -m src.sb.main
        timeout-minutes: 15
        continue-on-error: true

      - name: Run Venuerific scraper
        id: vrf
        run: uv run python -m src.vrf.main
        timeout-minutes: 15
        continue-on-error: true

      - name: Report scraper failures
        if: ${{ !cancelled() }}
        run: |
          FAILED=""
          [ "${{ steps.twn.outcome }}" = "failure" ] && FAILED="$FAILED twn"
          [ "${{ steps.bb.outcome }}" = "failure" ] && FAILED="$FAILED bb"
          [ "${{ steps.bly-venues.outcome }}" = "failure" ] && FAILED="$FAILED bly-venues"
          [ "${{ steps.bly-vendors.outcome }}" = "failure" ] && FAILED="$FAILED bly-vendors"
          [ "${{ steps.wd-venues.outcome }}" = "failure" ] && FAILED="$FAILED wd-venues"
          [ "${{ steps.wd-photographers.outcome }}" = "failure" ] && FAILED="$FAILED wd-photographers"
          [ "${{ steps.sb.outcome }}" = "failure" ] && FAILED="$FAILED sb"
          [ "${{ steps.vrf.outcome }}" = "failure" ] && FAILED="$FAILED vrf"
          if [ -n "$FAILED" ]; then
            echo "## Scraper Failures" >> $GITHUB_STEP_SUMMARY
            echo "The following scrapers failed:" >> $GITHUB_STEP_SUMMARY
            for s in $FAILED; do echo "  - $s" >> $GITHUB_STEP_SUMMARY; done
            echo "Check the step logs above for error details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and push data
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7
        with:
          commit_message: "chore(data): automated daily scrape"
          file_pattern: "data/*"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
