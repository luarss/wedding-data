name: PDF Text Extraction

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max PDFs to process (leave empty for all)"
        required: false
        default: ""
  workflow_run:
    workflows: ["Daily Wedding Data Extraction"]
    types: [completed]

concurrency:
  group: pdf-extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Extract PDFs to markdown
        id: extract
        continue-on-error: true
        env:
          OPENGATEWAY_API_KEY: ${{ secrets.OPENGATEWAY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQCLOUD_API_KEY: ${{ secrets.GROQCLOUD_API_KEY }}
        run: |
          ARGS="--concurrency 8"
          [ -n "${{ inputs.limit }}" ] && ARGS="$ARGS --limit ${{ inputs.limit }}"
          uv run python -m src.pdf_extract.main $ARGS

      - name: Commit and push extracted markdown files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- 'data/**/*.md'
          if git diff --cached --quiet; then
            echo "No .md files changed, skipping commit"
            exit 0
          fi
          git commit -m "chore(data): automated pdf text extraction"
          git pull --rebase origin main
          git push origin main
