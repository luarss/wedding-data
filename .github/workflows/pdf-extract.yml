name: PDF Text Extraction

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max PDFs to process (leave empty for all)"
        required: false
        default: ""
  workflow_run:
    workflows: ["Daily Wedding Data Scrape"]
    types: [completed]

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Extract PDFs to markdown
        env:
          OPENGATEWAY_API_KEY: ${{ secrets.OPENGATEWAY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          ARGS=""
          [ -n "${{ inputs.limit }}" ] && ARGS="--limit ${{ inputs.limit }}"
          uv run python -m src.pdf_extract.main $ARGS

      - name: Commit extracted markdown files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): automated pdf text extraction"
          file_pattern: "data/**/*.md"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
